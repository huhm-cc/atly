name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare signing key
        env:
          KS: ${{ secrets.ATLY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/atly.p12"
            echo "ATLY_KEYSTORE_PATH=$RUNNER_TEMP/atly.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ATLY_KEYSTORE_B64 未設定：只驗證建置，不發布 Release"
          fi
      - name: Build
        run: gradle assembleRelease --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk atly-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: atly-apk
          path: android/atly-v1.0.${{ github.run_number }}.apk
      - if: env.ATLY_KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: atly v1.0.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message || 'atly Android 版更新' }}
          files: android/atly-v1.0.${{ github.run_number }}.apk
